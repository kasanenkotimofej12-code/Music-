name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          mkdir -p www
          cp index-1.html www/index.html
          echo '{"name":"nash-pleer","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/core":"^6.1.0"},"devDependencies":{"@capacitor/cli":"^6.1.0"}}' > package.json
          echo '{"appId":"com.friends.pleer","appName":"Наш плеер","webDir":"www","backgroundColor":"#0d0820"}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nash-pleer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
